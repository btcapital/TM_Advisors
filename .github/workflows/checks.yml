name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  house-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # House rule: no em dashes anywhere in the site copy.
      # Fails the build so a stray dash can never reach production.
      - name: No em dashes
        shell: pwsh
        run: ./tools/check-no-emdash.ps1

      - name: No broken local links
        shell: pwsh
        run: ./tools/check-links.ps1

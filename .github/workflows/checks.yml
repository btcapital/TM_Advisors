name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  house-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # House rule: no em dashes anywhere in the site copy.
      # Fails the build so a stray dash can never reach production.
      - name: No em dashes
        shell: pwsh
        run: ./tools/check-no-emdash.ps1

      - name: No broken local links
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem . -Filter *.html | ForEach-Object {
            $page = $_.Name
            $t = Get-Content $_.FullName -Raw
            [regex]::Matches($t, '(?:href|src)="([^"#]+?)"') | ForEach-Object {
              $ref = $_.Groups[1].Value
              if ($ref -match '^(https?:|mailto:|tel:|data:)') { return }
              $clean = ($ref -split '\?')[0].TrimStart('/')
              # The Accounting Today badge is intentionally optional; the page
              # falls back to a text lockup when it is absent.
              if ($clean -eq 'assets/img/accounting-today-2026.png') { return }
              if (-not (Test-Path $clean)) { "MISSING  $page -> $ref"; $bad++ }
            }
          }
          if ($bad -gt 0) { Write-Host "FAIL: $bad broken reference(s)." -ForegroundColor Red; exit 1 }
          Write-Host 'PASS: all local references resolve.' -ForegroundColor Green
